[package]
name = "rupa-upwell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Upwell integration for RUPA: migration commands in an Upwell application's command line"

[features]
# Migration commands contributed to an Upwell application's command line by a
# plugin per migration target (`rupa_upwell::migrations`), in each enabled
# mode (alone: nothing).
migrations = ["dep:rupa-migrate", "rupa-migrate/cli", "dep:upwell-app", "dep:upwell-config", "dep:serde", "dep:thiserror"]
# Targets on sync sessions (`migrations::sync`).
sync = ["rupa-migrate?/sync"]
# Targets on async sessions (`migrations::asynchronous`).
async = ["rupa-migrate?/async"]

[dependencies]
rupa-migrate = { workspace = true, optional = true }
upwell-app = { workspace = true, optional = true }
upwell-config = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
