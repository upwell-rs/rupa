[package]
name = "rupa-driver-tokio-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Async RUPA executor on tokio-postgres"

[features]
# `PgPool` (on deadpool, spawning connections on tokio) and the registry
# driver `PgDriver`.
pool = ["dep:deadpool", "dep:tokio"]

[dependencies]
rupa-core.workspace = true
rupa-sql.workspace = true
tokio-postgres.workspace = true
postgres-types.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
deadpool = { workspace = true, optional = true, features = ["rt_tokio_1"] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
rupa-driver-tokio-postgres = { path = ".", features = ["pool"] }
rupa-conformance = { path = "../rupa-conformance" }
rupa = { path = "../rupa", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
testcontainers-modules.workspace = true
