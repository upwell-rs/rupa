[package]
name = "rupa-driver-tokio-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Async RUPA executor on tokio-postgres"

[features]
# The migration state error shared by migration sessions on both Postgres drivers.
migrations = ["dep:rupa-migrate"]
default = ["chrono", "uuid"]
# Date, time and UUID columns.
chrono = ["dep:chrono", "rupa-core/chrono", "tokio-postgres/with-chrono-0_4", "postgres-types/with-chrono-0_4"]
uuid = ["dep:uuid", "rupa-core/uuid", "tokio-postgres/with-uuid-1", "postgres-types/with-uuid-1"]
# `PgPool` (on deadpool, spawning connections on tokio).
pool = ["dep:deadpool", "dep:tokio", "rupa-core/deadpool"]
# The registry driver `PgDriver`, for run-time driver selection.
dynamic = ["pool", "rupa-core/dynamic"]
# TLS on rustls (ring, webpki roots): `sslmode=prefer|require` in the URL is honoured.
tls-rustls = ["dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
rupa-migrate = { workspace = true, optional = true }
rupa-core = { workspace = true, features = ["async"] }
hashlink.workspace = true
rupa-sql.workspace = true
thiserror.workspace = true
tokio-postgres.workspace = true
postgres-types.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde_json.workspace = true
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
deadpool = { workspace = true, optional = true, features = ["rt_tokio_1"] }
tokio = { workspace = true, optional = true }

[dev-dependencies]
rupa-driver-tokio-postgres = { path = ".", features = ["dynamic"] }
rupa-conformance = { path = "../rupa-conformance" }
rupa = { path = "../rupa", features = ["tokio", "dynamic"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
testcontainers-modules.workspace = true
