[package]
name = "rupa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Rust Unified Persistence API: explicit, attribute-driven repositories over any SQL database"

[features]
migrations = [
    "dep:rupa-migrate",
    "rupa-driver-rusqlite?/migrations",
    "rupa-driver-postgres?/migrations",
    "rupa-driver-tokio-postgres?/migrations",
    "rupa-driver-mysql?/migrations",
]
default = ["chrono", "uuid"]

# Column types. Each is forwarded to every enabled driver.
chrono = [
    "rupa-core/chrono",
    "rupa-driver-tokio-postgres?/chrono",
    "rupa-driver-postgres?/chrono",
    "rupa-driver-rusqlite?/chrono",
    "rupa-driver-mysql?/chrono",
    "rupa-driver-sqlx?/chrono",
    "rupa-driver-memory?/chrono",
]
uuid = [
    "rupa-core/uuid",
    "rupa-driver-tokio-postgres?/uuid",
    "rupa-driver-postgres?/uuid",
    "rupa-driver-rusqlite?/uuid",
    "rupa-driver-mysql?/uuid",
    "rupa-driver-sqlx?/uuid",
    "rupa-driver-memory?/uuid",
]

# Sync execution where a mode split exists (so far migrations:
# `rupa::migrate::sync`). Sync-only drivers enable it; neither mode is default.
sync = ["rupa-migrate?/sync"]
# Async executors, transactions, pools and repositories (`async fn` in
# `#[repository]`). Runtime-agnostic: no runtime is compiled in by this alone.
async = [
    "rupa-core/async",
    "rupa-migrate?/async",
    "rupa-macros/async",
    "dep:pollster",
    "rupa-driver-memory?/async",
]
# Sync methods of async repositories block with tokio's `block_in_place`
# (multi-threaded runtime) instead of a minimal local executor.
tokio = ["async", "dep:tokio"]
# Run-time driver selection and type erasure: `rupa::registry()`,
# `rupa::connect`, `Database`, the boxed executors and each enabled driver's
# registry entry. Off by default: a statically typed pool or executor has no
# erasure overhead.
dynamic = [
    "async",
    "rupa-core/dynamic",
    "rupa-driver-tokio-postgres?/dynamic",
    "rupa-driver-postgres?/dynamic",
    "rupa-driver-rusqlite?/dynamic",
    "rupa-driver-mysql?/dynamic",
    "rupa-driver-sqlx?/dynamic",
    "rupa-driver-memory?/dynamic",
]

# Drivers; each crate is re-exported under `rupa::drivers`.
# Async Postgres (tokio-postgres + deadpool).
postgres = ["async", "dep:rupa-driver-tokio-postgres", "rupa-driver-tokio-postgres/pool"]
# Sync Postgres (postgres + r2d2); cannot run inside a tokio runtime.
postgres-sync = ["sync", "dep:rupa-driver-postgres", "rupa-driver-postgres/pool"]
# SQLite (rusqlite + r2d2), compiled from source.
sqlite = ["sqlite-unbundled", "rupa-driver-rusqlite/bundled"]
# SQLite (rusqlite + r2d2), linking the system SQLite (3.38+).
sqlite-unbundled = ["sync", "dep:rupa-driver-rusqlite", "rupa-driver-rusqlite/pool"]
# Sync MySQL 8 (mysql + r2d2).
mysql = ["sync", "dep:rupa-driver-mysql", "rupa-driver-mysql/pool"]
# The in-memory backend (tests, prototypes).
memory = ["dep:rupa-driver-memory"]
# Async drivers on sqlx (+ deadpool).
sqlx-postgres = ["async", "dep:rupa-driver-sqlx", "rupa-driver-sqlx/postgres", "rupa-driver-sqlx/pool"]
sqlx-mysql = ["async", "dep:rupa-driver-sqlx", "rupa-driver-sqlx/mysql", "rupa-driver-sqlx/pool"]
# SQLite on sqlx's per-connection worker threads, compiled from source.
sqlx-sqlite = ["async", "dep:rupa-driver-sqlx", "rupa-driver-sqlx/sqlite", "rupa-driver-sqlx/pool"]
# SQLite on sqlx, linking the system SQLite.
sqlx-sqlite-unbundled = ["async", "dep:rupa-driver-sqlx", "rupa-driver-sqlx/sqlite-unbundled", "rupa-driver-sqlx/pool"]
# TLS (rustls, configured in the URL) for every enabled networked driver.
# native-tls is not offered: it pulls in OpenSSL on Linux.
tls-rustls = [
    "rupa-driver-tokio-postgres?/tls-rustls",
    "rupa-driver-postgres?/tls-rustls",
    "rupa-driver-mysql?/tls-rustls",
    "rupa-driver-sqlx?/tls-rustls",
]
# Every driver, with run-time selection.
full = [
    "migrations",
    "postgres",
    "postgres-sync",
    "sqlite",
    "mysql",
    "memory",
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
    "dynamic",
]

# DI integrations. Each is one optional dep + one feature; never default.
upwell = ["dep:rupa-upwell"]

[dependencies]
rupa-migrate = { workspace = true, optional = true }
rupa-core.workspace = true
rupa-macros.workspace = true
rupa-sql.workspace = true
rupa-dsl-std.workspace = true
rupa-upwell = { workspace = true, optional = true }
rupa-driver-tokio-postgres = { workspace = true, optional = true }
rupa-driver-postgres = { workspace = true, optional = true }
rupa-driver-rusqlite = { workspace = true, optional = true }
rupa-driver-mysql = { workspace = true, optional = true }
rupa-driver-memory = { workspace = true, optional = true }
rupa-driver-sqlx = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
rupa = { path = ".", features = ["memory", "dynamic"] }
rupa-driver-memory = { path = "../rupa-driver-memory", features = ["dynamic"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
pollster.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[example]]
name = "sqlite_crud"
required-features = ["sqlite"]

[[example]]
name = "sqlite_joins"
required-features = ["sqlite"]

[[example]]
name = "sqlite_dsl"
required-features = ["sqlite"]

[[example]]
name = "sqlite_repository"
required-features = ["sqlite"]

[[example]]
name = "sqlite_repository_tx"
required-features = ["sqlite"]

[[example]]
name = "sqlite_config"
required-features = ["sqlite", "dynamic"]

[[example]]
name = "sqlite_async"
required-features = ["sqlx-sqlite"]
