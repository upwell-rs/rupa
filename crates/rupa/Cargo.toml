[package]
name = "rupa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Rust Unified Persistence API: explicit, attribute-driven repositories over any SQL database"

[features]
nightly = ["rupa-core/nightly"]
# DI integrations. Each is one optional dep + one feature; never default.
upwell = ["dep:rupa-upwell"]
# Sync methods of async repositories block with tokio's `block_in_place`
# (multi-threaded runtime) instead of a minimal local executor.
tokio = ["dep:tokio"]

[dependencies]
rupa-core.workspace = true
rupa-macros.workspace = true
rupa-sql.workspace = true
rupa-dsl-std.workspace = true
rupa-upwell = { workspace = true, optional = true }
pollster.workspace = true
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }

[dev-dependencies]
rupa-driver-memory = { path = "../rupa-driver-memory" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
pollster.workspace = true
