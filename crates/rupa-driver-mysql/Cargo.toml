[package]
name = "rupa-driver-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Synchronous RUPA executor on the mysql crate (MySQL 8.0+)"

[features]
default = ["chrono", "uuid"]
# Date, time and UUID columns.
chrono = ["dep:chrono", "rupa-core/chrono", "mysql/chrono"]
uuid = ["dep:uuid", "rupa-core/uuid"]
# `MySqlPool` (on r2d2).
pool = ["dep:r2d2", "rupa-core/r2d2"]
# The registry driver `MySqlDriver`, for run-time driver selection.
dynamic = ["pool", "rupa-core/dynamic", "rupa-core/async"]
# `rupa_migrate::sync::Session` on `MySqlExecutor`: named-lock exclusion and
# nontransactional migrations.
migrations = ["dep:rupa-migrate", "rupa-migrate/sync", "rupa-migrate/protocol"]
# TLS on rustls (ring), configured in the URL (`?require_ssl=true`).
tls-rustls = ["mysql/rustls-tls-ring"]

[dependencies]
rupa-core.workspace = true
rupa-sql.workspace = true
rupa-migrate = { workspace = true, optional = true }
thiserror.workspace = true
mysql.workspace = true
serde_json.workspace = true
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }

[dev-dependencies]
rupa-driver-mysql = { path = ".", features = ["dynamic", "migrations"] }
rupa-conformance = { path = "../rupa-conformance", features = ["migrations"] }
rupa = { path = "../rupa", features = ["dynamic", "migrations"] }
pollster.workspace = true
testcontainers-modules = { workspace = true, features = ["blocking"] }
