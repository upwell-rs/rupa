[package]
name = "rupa-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
description = "Shared behavioural test suite run against every RUPA driver"

[features]
# The shared migration cases (`migrations::run_migrations`).
migrations = ["rupa/migrations"]

[dependencies]
rupa = { path = "../rupa", features = ["dynamic"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
