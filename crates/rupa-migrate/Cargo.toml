[package]
name = "rupa-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Explicit migration catalogs, history and execution for RUPA"

[features]
# Synchronous sessions, bodies and `apply` (`rupa_migrate::sync`).
sync = []
# Asynchronous sessions, bodies and `apply` (`rupa_migrate::asynchronous`).
async = ["rupa-core/async"]
# The engine session protocols driver crates implement sessions on, in each
# enabled mode; not public API.
protocol = []

[dependencies]
rupa-core.workspace = true
rupa-sql.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
