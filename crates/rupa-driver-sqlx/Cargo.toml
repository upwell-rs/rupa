[package]
name = "rupa-driver-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Async RUPA executors on sqlx: Postgres, MySQL and SQLite"

[features]
# One feature per database; enable any combination.
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# SQLite compiled in (sqlx's `sqlite` feature, which bundles it).
sqlite = ["sqlx/sqlite"]
# `SqlxPool` (on deadpool) and the registry drivers.
pool = ["dep:deadpool", "dep:tokio"]
# TLS for Postgres and MySQL (`sslmode=require` / `ssl-mode=REQUIRED` in the
# URL). Without one of these, only unencrypted connections work.
tls-rustls = ["sqlx/tls-rustls"]
tls-native-tls = ["sqlx/tls-native-tls"]

[dependencies]
rupa-core.workspace = true
rupa-sql.workspace = true
sqlx.workspace = true
futures-util.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
deadpool = { workspace = true, optional = true, features = ["rt_tokio_1"] }
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
rupa-driver-sqlx = { path = ".", features = ["postgres", "mysql", "sqlite", "pool"] }
rupa-conformance = { path = "../rupa-conformance" }
rupa = { path = "../rupa", features = ["tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
testcontainers-modules.workspace = true

[package.metadata.docs.rs]
all-features = true
