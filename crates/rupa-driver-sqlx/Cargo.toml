[package]
name = "rupa-driver-sqlx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Async RUPA executors on sqlx: Postgres, MySQL and SQLite"

[features]
default = ["chrono", "uuid"]
# One feature per database; enable any combination.
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
# SQLite compiled from source (sqlx's `sqlite`).
sqlite = ["_sqlite", "sqlx/sqlite"]
# SQLite linked from the system (sqlx's `sqlite-unbundled`).
sqlite-unbundled = ["_sqlite", "sqlx/sqlite-unbundled"]
_sqlite = []
# Date, time and UUID columns.
chrono = ["dep:chrono", "rupa-core/chrono", "sqlx/chrono"]
uuid = ["dep:uuid", "rupa-core/uuid", "sqlx/uuid"]
# `SqlxPool` (on deadpool).
pool = ["dep:deadpool", "dep:tokio", "rupa-core/deadpool"]
# The registry drivers, for run-time driver selection.
dynamic = ["pool", "rupa-core/dynamic"]
# TLS for Postgres and MySQL on rustls (ring, webpki roots), configured in
# the URL (`sslmode=require` / `ssl-mode=REQUIRED`).
tls-rustls = ["sqlx/tls-rustls"]

[dependencies]
rupa-core = { workspace = true, features = ["async"] }
rupa-sql.workspace = true
thiserror.workspace = true
sqlx.workspace = true
futures-util.workspace = true
serde_json.workspace = true
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
deadpool = { workspace = true, optional = true, features = ["rt_tokio_1"] }
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
rupa-driver-sqlx = { path = ".", features = ["postgres", "mysql", "sqlite", "dynamic"] }
rupa-conformance = { path = "../rupa-conformance" }
rupa = { path = "../rupa", features = ["tokio", "dynamic"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
testcontainers-modules.workspace = true

[package.metadata.docs.rs]
all-features = true
