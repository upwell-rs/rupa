[package]
name = "rupa-driver-rusqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Synchronous RUPA executor on rusqlite (SQLite 3.38+)"

[features]
default = ["bundled"]
# Compile SQLite from source (rusqlite's `bundled`); turn off to link a system SQLite >= 3.38.
bundled = ["rusqlite/bundled"]
# `SqlitePool` (on r2d2) and the registry driver `SqliteDriver`.
pool = ["dep:r2d2"]

[dependencies]
rupa-core.workspace = true
rupa-sql.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
r2d2 = { workspace = true, optional = true }

[dev-dependencies]
rupa-driver-rusqlite = { path = ".", features = ["pool"] }
rupa-conformance = { path = "../rupa-conformance" }
rupa = { path = "../rupa" }
pollster.workspace = true
