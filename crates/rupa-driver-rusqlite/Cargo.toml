[package]
name = "rupa-driver-rusqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Synchronous RUPA executor on rusqlite (SQLite 3.38+)"

[features]
migrations = ["dep:rupa-migrate", "rupa-migrate/sync", "rusqlite/hooks"]
default = ["bundled", "chrono", "uuid"]
# Compile SQLite from source (rusqlite's `bundled`); turn off to link a system SQLite >= 3.38.
bundled = ["rusqlite/bundled"]
# Date, time and UUID columns.
chrono = ["rupa-core/chrono"]
uuid = ["dep:uuid", "rupa-core/uuid"]
# `SqlitePool` (on r2d2).
pool = ["dep:r2d2", "rupa-core/r2d2"]
# The registry driver `SqliteDriver`, for run-time driver selection.
dynamic = ["pool", "rupa-core/dynamic", "rupa-core/async"]

[dependencies]
rupa-migrate = { workspace = true, optional = true }
rupa-core.workspace = true
rupa-sql.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
uuid = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }

[dev-dependencies]
rupa-driver-rusqlite = { path = ".", features = ["dynamic", "migrations"] }
rupa-conformance = { path = "../rupa-conformance", features = ["migrations"] }
rupa = { path = "../rupa", features = ["dynamic", "migrations"] }
pollster.workspace = true
