[package]
name = "rupa-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Derive and attribute macros for RUPA"

[lib]
proc-macro = true

[features]
# `async fn` methods in `#[repository]`; set by the `rupa` facade's `async`.
async = []
# `#[repository(database = ..)]`: the repository registers itself as an
# Upwell provider over a declared database; set by the `rupa` facade's
# `upwell-database`.
upwell = []

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
rupa = { path = "../rupa", features = ["dynamic"] }
rupa-driver-memory = { path = "../rupa-driver-memory", features = ["dynamic"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
trybuild.workspace = true
insta.workspace = true
pollster.workspace = true
rupa-sql = { path = "../rupa-sql" }
