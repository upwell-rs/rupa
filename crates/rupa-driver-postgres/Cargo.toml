[package]
name = "rupa-driver-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "Synchronous RUPA executor on the postgres crate"

[features]
# `rupa_migrate::Session` on `PgExecutor`: advisory-lock exclusion and history tables.
migrations = ["dep:rupa-migrate", "rupa-driver-tokio-postgres/migrations"]
default = ["chrono", "uuid"]
# Date, time and UUID columns.
chrono = ["rupa-driver-tokio-postgres/chrono", "postgres/with-chrono-0_4"]
uuid = ["rupa-driver-tokio-postgres/uuid", "postgres/with-uuid-1"]
# `PgPool` (on r2d2).
pool = ["dep:r2d2", "rupa-core/r2d2"]
# The registry driver `PgDriver`, for run-time driver selection.
dynamic = ["pool", "rupa-core/dynamic", "rupa-core/async"]
# TLS on rustls (ring, webpki roots): `sslmode=prefer|require` in the URL is honoured.
tls-rustls = ["rupa-driver-tokio-postgres/tls-rustls"]

[dependencies]
rupa-migrate = { workspace = true, optional = true }
rupa-core.workspace = true
rupa-sql.workspace = true
rupa-driver-tokio-postgres.workspace = true
r2d2 = { workspace = true, optional = true }
postgres.workspace = true

[dev-dependencies]
rupa-driver-postgres = { path = ".", features = ["dynamic", "migrations"] }
rupa-conformance = { path = "../rupa-conformance", features = ["migrations"] }
rupa = { path = "../rupa", features = ["dynamic", "migrations"] }
pollster.workspace = true
testcontainers-modules = { workspace = true, features = ["blocking"] }
