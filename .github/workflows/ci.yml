name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Every feature of every crate, so all pool, registry and TLS code is linted.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --workspace --no-deps --features rupa/full,rupa/tls-rustls
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: feature matrix
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # Each facade feature must build on its own, as must no features at all.
      - run: |
          set -e
          cargo check -p rupa --no-default-features
          for f in migrations chrono uuid sync async tokio dynamic postgres postgres-sync sqlite sqlite-unbundled mysql memory sqlx-postgres sqlx-mysql sqlx-sqlite sqlx-sqlite-unbundled tls-rustls full; do
            echo "::group::rupa/$f"
            cargo check -p rupa --features "$f"
            echo "::endgroup::"
          done
          cargo check -p rupa --no-default-features --features full,tls-rustls
      # Migration execution modes compile alone and together.
      - run: |
          set -e
          for f in sync async sync,async; do
            cargo check -p rupa-migrate --all-targets --features "$f"
          done
      # Each crate must build (with its tests) on its own features, not only
      # through workspace feature unification.
      - run: |
          set -e
          for p in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name'); do
            echo "::group::$p"
            cargo check -p "$p" --all-targets
            echo "::endgroup::"
          done

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.99", nightly]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Includes the Docker-backed suites (Postgres, MySQL) and in-process
      # SQLite; .config/nextest.toml caps how many containers run at once.
      # trybuild snapshots are pinned to MSRV diagnostics; nightly wording drifts.
      - if: matrix.toolchain == '1.99'
        run: cargo nextest run --profile ci --workspace --features rupa/full
      - if: matrix.toolchain == 'nightly'
        run: cargo nextest run --profile ci --workspace --features rupa/full -E 'not test(ui)'
      - run: cargo run -p rupa-example-app -- primary apply
      - run: cargo run -p rupa-example-app -- reporting apply
      # nextest doesn't run doctests.
      - run: cargo test --doc --workspace --features rupa/full
      # trybuild's work dir looks like a nested target dir to rust-cache, whose
      # cleanup then fails on restore (ENOENT on `target/tests/target`). It
      # isn't worth caching: keep it out of the saved cache.
      - if: always()
        run: rm -rf target/tests

  upwell:
    name: upwell integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rupa --features upwell

  bench:
    name: benchmarks
    # Shared runners are noisy: numbers are for spotting large regressions
    # over time, not small ones. Compare locally with `--save-baseline`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p rupa-bench --bench build_render --bench execute -- --quick --noplot
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
