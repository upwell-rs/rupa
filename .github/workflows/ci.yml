name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.99", nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # trybuild snapshots are pinned to MSRV diagnostics; nightly wording drifts.
      - if: matrix.toolchain == '1.99'
        run: cargo test --workspace
      - if: matrix.toolchain == 'nightly'
        run: cargo test --workspace --features rupa/nightly -- --skip ui

  upwell:
    name: upwell integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rupa --features upwell
