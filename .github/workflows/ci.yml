name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint (fmt, clippy, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `rupa/full` enables every driver, so all pool and registry code is linted.
      - run: cargo clippy --workspace --all-targets --features rupa/full -- -D warnings
      - run: cargo doc --workspace --no-deps --features rupa/full
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    name: facade features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # Each driver feature must build on its own (and none at all).
      - run: |
          cargo check -p rupa
          for f in postgres postgres-sync sqlite mysql memory full; do
            echo "::group::rupa/$f"
            cargo check -p rupa --features "$f"
            echo "::endgroup::"
          done

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.99", nightly]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # Includes the Docker-backed suites (Postgres, MySQL) and in-process SQLite.
      # trybuild snapshots are pinned to MSRV diagnostics; nightly wording drifts.
      - if: matrix.toolchain == '1.99'
        run: cargo test --workspace --features rupa/full
      - if: matrix.toolchain == 'nightly'
        run: cargo test --workspace --features rupa/full,rupa/nightly -- --skip ui

  upwell:
    name: upwell integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rupa --features upwell

  bench:
    name: benchmarks
    # Shared runners are noisy: numbers are for spotting large regressions
    # over time, not small ones. Compare locally with `--save-baseline`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p rupa-bench --bench build_render --bench execute -- --quick --noplot
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
