[workspace]
resolver = "3"
members = ["crates/*", "examples/migrations/*"]

[workspace.package]
# Lockstep versioning: every member shares this version (see docs/design/versioning.md).
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/upwell-rs/rupa"

[workspace.dependencies]
rupa-migrate = { path = "crates/rupa-migrate", version = "=0.1.0" }
rupa-build = { path = "crates/rupa-build", version = "=0.1.0" }
sha2 = "0.11"
# Intra-workspace crates are pinned exactly: macros emit paths into rupa-core's
# hidden API, so mismatched versions must be impossible to resolve.
rupa-core = { path = "crates/rupa-core", version = "=0.1.0", default-features = false }
rupa-macros = { path = "crates/rupa-macros", version = "=0.1.0" }
rupa-sql = { path = "crates/rupa-sql", version = "=0.1.0" }
rupa-dsl-std = { path = "crates/rupa-dsl-std", version = "=0.1.0" }
rupa-upwell = { path = "crates/rupa-upwell", version = "=0.1.0" }
rupa-driver-tokio-postgres = { path = "crates/rupa-driver-tokio-postgres", version = "=0.1.0", default-features = false }
rupa-driver-postgres = { path = "crates/rupa-driver-postgres", version = "=0.1.0", default-features = false }
rupa-driver-rusqlite = { path = "crates/rupa-driver-rusqlite", version = "=0.1.0", default-features = false }
rupa-driver-mysql = { path = "crates/rupa-driver-mysql", version = "=0.1.0", default-features = false }
rupa-driver-sqlx = { path = "crates/rupa-driver-sqlx", version = "=0.1.0", default-features = false }
rupa-driver-memory = { path = "crates/rupa-driver-memory", version = "=0.1.0", default-features = false }

proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["serde"] }
trybuild = "1"
insta = "1"
pollster = "1"
tokio = { version = "1", features = ["rt", "macros"] }
hashlink = "0.11"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
postgres-types = { version = "0.2", features = ["with-serde_json-1"] }
bytes = "1"
# 0.39, not 0.40: sqlx 0.9's SQLite needs libsqlite3-sys < 0.38, and a build
# can link only one SQLite.
rusqlite = "0.39"
mysql = { version = "28", default-features = false, features = ["default-rust"] }
# The runtime and databases are chosen by rupa-driver-sqlx's features.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "json"] }
# The SQLite sqlx links, for the migration authorizer sqlx does not expose;
# its version must stay within sqlx-sqlite's range.
libsqlite3-sys = { version = "0.37", default-features = false }
r2d2 = "0.8"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
deadpool = { version = "0.13", default-features = false, features = ["managed"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }
