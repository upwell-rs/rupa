[env]
# Loads the gitignored .env, which exports the GIT_AUTHOR_*/GIT_COMMITTER_*
# variables git uses for commit identity. This scopes the personal identity to
# this directory without touching global git config. Create .env with
# GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME and GIT_COMMITTER_EMAIL.
_.file = ".env"
